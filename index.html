<body class="dark-mode">
    <header>
        <div class="container">
            <div class="logo">
                <a class="btn-log" href="index.html">WinBry+</a>
            </div>
            <nav class="main-nav">
                <ul>
                    <li><a href="index.html" class="active">Início</a></li>
                    <li><a href="filmes.html">Filmes</a></li>
                    <li><a href="series.html">Séries</a></li>
                    <li><a href="animes.html">Animes</a></li>
                </ul>
            </nav>
            <div class="user-actions">
                <div class="search-box">
                    <input type="text" id="search-input" placeholder="Buscar filmes, séries, animes...">
                    <a id="search-icon" class="icon-btn"><i class="fas fa-search"></i></a>
                </div>
                <a id="theme-toggle" class="icon-btn"><i class="fas fa-sun"></i></a>
                <a href="formulario.html" class="icon-btn"><i class="fas fa-comments"></i></a>
                <a href="minha-lista.html" class="icon-btn"><i class="fas fa-bookmark"></i></a>
                <a id="user-action" href="login.html" class="btn btn-primary">Entrar</a>
            </div>
            <button class="menu-toggle"><i class="fas fa-bars"></i></button>
        </div>
    </header>

    <main>
        <section class="hero-banner">
            <img src="images/banner-filme.png" alt="Destaque" class="banner-img">
            <div class="container">
                <div class="hero-content">
                    <h1>Carregando Destaque...</h1>
                    <p>Aguarde enquanto trazemos o melhor conteúdo para você.</p>

                    <div class="hero-actions">
                        <button id="btn-open-player" class="btn btn-play">
                            <i class="fas fa-play"></i> Assistir Agora
                        </button>
                        <a href="#" class="btn btn-info">
                            <i class="fas fa-info-circle"></i> Mais Informações
                        </a>
                    </div>
                </div>
            </div>
        </section>

        <section class="hubs-section">
            <div class="container">
                <h2>Explore o Multiverso do Entretenimento</h2>
                <div class="hubs-container">
                    <a href="filmes.html?search=Marvel&global=true" class="hub-item">
                        <img src="images/logo-marvel.png" alt="Logo da Marvel">
                    </a>

                    <a href="filmes.html?search=DC&global=true" class="hub-item">
                        <img src="images/logo-dc.png" alt="Logo da DC">
                    </a>

                    <a href="filmes.html?search=cartoon&global=true" class="hub-item">
                        <img src="images/logo-cn.png" alt="Logo da Cartoon Network">
                    </a>

                    <a href="filmes.html?search=Harry Potter&global=true" class="hub-item">
                        <img src="images/logo-harry-potter.png" alt="Logo de Harry Potter">
                    </a>

                    <a href="filmes.html?search=Star Wars&global=true" class="hub-item">
                        <img src="images/logo-star-wars.png" alt="Logo do Star Wars">
                    </a>

                    <a href="filmes.html?search=Adult&global=true" class="hub-item">
                        <img src="images/logo-adult-swim.png" alt="Logo da AdultSwim">
                    </a>

                    <a href="filmes.html?search=Jurassic&global=true" class="hub-item">
                        <img src="images/logo-jurassic-world.png" alt="Logo do Jurassic World">
                    </a>

                    <a href="filmes.html?search=Velozes&global=true" class="hub-item">
                        <img src="images/logo-fast-furious.png" alt="Logo dos Velozes e Furiosos">
                    </a>

                    <a href="filmes.html?search=Jogos&global=true" class="hub-item">
                        <img src="images/logo-hunger-games.png" alt="Logo dos Jogos Vorazes">
                    </a>

                    <a href="filmes.html?search=Crepusculo&global=true" class="hub-item">
                        <img src="images/logo-twilight.png" alt="Logo da Saga Crepusculo">
                    </a>

                    <a href="filmes.html?search=Transformers&global=true" class="hub-item">
                        <img src="images/logo-transformers.png" alt="Logo de Transformers">
                    </a>

                    <a href="filmes.html?search=Disney&global=true" class="hub-item">
                        <img src="images/logo-disney.png" alt="Logo da Disney">
                    </a>

                    <a href="filmes.html?search=Illumination&global=true" class="hub-item">
                        <img src="images/logo-illumination.png" alt="Logo da Illumination">
                    </a>

                    <a href="filmes.html?search=Invocacao&global=true" class="hub-item">
                        <img src="images/logo-invocacao-do-mal.png" alt="Logo de Invocação do Mal">
                    </a>
                </div>
            </div>
        </section>

        <section class="content-section" id="continue-watching-section" style="display: none;">
            <div class="container">
            </div>
        </section>

        <section class="content-section" id="top10-section">
            <div class="container"></div>
        </section>

        <section class="content-section" id="filmes-populares-section">
            <div class="container">
            </div>
        </section>

        <section class="content-section" id="series-em-alta-section">
            <div class="container">
            </div>
        </section>

        <section class="content-section" id="categorias-section">
            <div class="container"></div>
        </section>

        <section class="content-section" id="animes-recomendados-section">
            <div class="container">
            </div>
        </section>

        <section class="content-section" id="em-breve-section">
            <div class="container"></div>
        </section>

    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 WinBry+ | Todos os direitos reservados.</p>
            <div class="social-links">
                <a href="#"><i class="fab fa-facebook-f"></i></a>
                <a href="#"><i class="fab fa-twitter"></i></a>
                <a href="#"><i class="fab fa-instagram"></i></a>
            </div>
        </div>
    </footer>

    <div id="video-modal" class="video-modal">
        <div class="video-modal-content">
            <div id="close-player" class="close-btn-custom">
                <i class="fas fa-times"></i>
            </div>

            <div class="video-wrapper">
                <iframe id="video-iframe" src="" frameborder="0" allow="autoplay; encrypted-media"
                    allowfullscreen></iframe>
            </div>

            <div id="player-controls" class="player-controls">

                <div id="serie-inputs" class="control-section" style="display:none;">
                    <div class="input-group">
                        <label>Temp.</label>
                        <input type="number" id="current-season" min="1" value="1">
                    </div>
                    <div class="input-group">
                        <label>Ep.</label>
                        <input type="number" id="current-episode" min="1" value="1">
                    </div>
                </div>

                <div class="control-section border-left">
                    <span class="label-title">Parou em:</span>
                    <div class="input-group">
                        <input type="number" id="stop-hour" min="0" placeholder="0">
                        <span class="unit">h</span>
                    </div>
                    <div class="input-group">
                        <input type="number" id="stop-min" min="0" max="59" placeholder="00">
                        <span class="unit">m</span>
                    </div>
                </div>

                <button id="save-progress-btn" class="btn-save">
                    <i class="fas fa-save"></i> Salvar
                </button>
            </div>
        </div>
    </div>

    <script src="/app.js"></script>
</body>

</html>
