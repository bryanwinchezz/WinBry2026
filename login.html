<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WinBry+ | Login</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/core-js/3.32.1/minified.js"></script>
  <link rel="icon" href="images/favicon.png" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
</head>

<body class="dark-mode">
  <div class="auth-wrapper">
    <div class="auth-box">
      <a href="index.html" class="logo-auth">WinBry+</a>
      <h2>Entrar</h2>
      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" required placeholder="Digite seu email">
        </div>
        <div class="form-group">
          <label for="senha">Senha</label>
          <input type="password" id="senha" required placeholder="Digite sua senha">
        </div>
        <button type="submit" class="btn btn-primary btn-full">Entrar</button>
        <p class="auth-link">Não tem uma conta? <a href="cadastro.html">Cadastre-se</a></p>
      </form>
    </div>
  </div>

  <script src="/app.js"></script>
</body>

</html>
